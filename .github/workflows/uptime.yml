name: uptime
# GitHub runs schedules late (hours apart), so each run loops for ~5h50m,
# checking every 5 minutes; new scheduled runs queue behind the current one.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: uptime
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: Probe every 5 minutes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          end=$(( $(date +%s) + 350*60 ))
          gh label create down -R "$REPO" --color B60205 2>/dev/null || true
          probe() { # name url method
            local code
            for i in 1 2 3; do
              if [ "$3" = HEAD ]; then flag=-I; else flag=; fi
              code=$(curl -s $flag -o /dev/null -w '%{http_code}' --max-time 15 "$2") || code=000
              [ "$code" = "200" ] && return 0
              sleep 20
            done
            fail="$fail\n- $1: HTTP $code ($2)"
          }
          while [ "$(date +%s)" -lt "$end" ]; do
            fail=""
            probe "API (DB + schema + Redis)" https://wasla.amratef.dev/healthz HEAD
            probe "Website" https://wasla.amratef.dev/ GET
            probe "Login page" https://wasla.amratef.dev/login GET
            open=$(gh issue list -R "$REPO" --label down --state open --json number --jq '.[0].number' || true)
            if [ -n "$fail" ]; then
              echo "$(date -u +%H:%M) DOWN:$fail"
              if [ -z "$open" ]; then
                gh issue create -R "$REPO" --label down --assignee "$OWNER" \
                  --title "🔴 Wasla is DOWN ($(date -u +%H:%MZ))" \
                  --body "$(printf 'Failed checks (3 tries each):%b\n\nThis issue closes itself when everything is back.' "$fail")" || true
              fi
            else
              echo "$(date -u +%H:%M) ok"
              [ -n "$open" ] && gh issue close "$open" -R "$REPO" --comment "🟢 Back up at $(date -u +%H:%MZ)." || true
            fi
            sleep 300
          done
  keepalive:
    # GitHub disables scheduled workflows after 60 days without repo activity.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          last=$(cat last-keepalive.txt 2>/dev/null || echo 1970-01-01)
          if [ $(( ( $(date +%s) - $(date -d "$last" +%s) ) / 86400 )) -ge 30 ]; then
            date -u +%F > last-keepalive.txt
            git config user.name "wasla-status-bot"; git config user.email "actions@users.noreply.github.com"
            git add last-keepalive.txt && git commit -m "keepalive $(date -u +%F)" && git push
          fi
